[package]
name = "modelcoder-desktop"
version = "2.6.0"
description = "ModelCoder 3D Studio - Native Desktop Application"
authors = ["Franciscuarto"]
license = "MIT"
edition = "2021"

[lib]
name = "modelcoder_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
